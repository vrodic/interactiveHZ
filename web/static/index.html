<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HŽ Interactive Train Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app-container">
        <header id="header">
            <div class="logo-section">
                <span class="logo-badge">HŽ PP</span>
                <span class="title">Interactive Map</span>
            </div>
            <nav class="nav-menu">
                <button id="nav-active-trains" class="nav-btn">🚆 Active Trains</button>
                <button id="nav-routes" class="nav-btn">🗺️ Trip Planner</button>
                <button id="nav-dashboard" class="nav-btn">📊 Dashboard</button>
            </nav>
            <div class="search-section">
                <input type="text" id="search-input" class="search-input" placeholder="Search station or train...">
                <div id="search-results" class="search-results"></div>
            </div>
        </header>

        <div id="map"></div>

        <div id="time-controls">
            <button id="realtime-btn" class="time-btn active">🔴 Realtime</button>
            <button id="play-btn" class="time-btn">▶ Play</button>
            <span id="time-display" class="time-display">12:00:00</span>
            <input type="range" id="time-slider" class="time-slider" min="0" max="86399" value="43200">
        </div>

        <div id="side-panel">
            <div class="panel-header">
                <span class="panel-title">Details</span>
                <button id="close-panel" class="close-btn">&times;</button>
            </div>
            <div id="panel-content"></div>
        </div>

        <!-- Active Trains Modal -->
        <div id="active-trains-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="panel-title">🚆 Currently Active Trains</span>
                    <button class="close-btn" id="close-active-trains-modal">&times;</button>
                </div>
                <div class="modal-body" id="active-trains-modal-body">
                    <!-- Dynamic Table -->
                </div>
            </div>
        </div>

        <!-- Dashboard Stats Modal -->
        <div id="dashboard-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="panel-title">📊 Live Dashboard & Statistics</span>
                    <button class="close-btn" id="close-dashboard-modal">&times;</button>
                </div>
                <div class="modal-body" id="dashboard-modal-body">
                    <!-- Dynamic Dashboard -->
                </div>
            </div>
        </div>

        <!-- Trip Planner / Routes Bottom Drawer Segment -->
        <div id="trip-planner-drawer" class="bottom-drawer" style="display: none;">
            <div class="drawer-header">
                <span class="panel-title">🗺️ Train Trip Planner</span>
                <button class="close-btn" id="close-trip-planner-drawer">&times;</button>
            </div>
            <div class="drawer-body">
                <div style="display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;">
                    <div style="flex: 1; min-width: 200px;">
                        <label style="font-size: 11px; color: #a0aec0; display: block; margin-bottom: 4px;">FROM (ORIGIN STATION)</label>
                        <select id="route-from-select" style="width: 100%; padding: 8px; background: #1e242e; color: #fff; border: 1px solid #3a4250; border-radius: 6px;">
                            <option value="">Select origin station...</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label style="font-size: 11px; color: #a0aec0; display: block; margin-bottom: 4px;">TO (DESTINATION STATION)</label>
                        <select id="route-to-select" style="width: 100%; padding: 8px; background: #1e242e; color: #fff; border: 1px solid #3a4250; border-radius: 6px;">
                            <option value="">Select destination station...</option>
                        </select>
                    </div>
                    <div style="align-self: flex-end;">
                        <button id="find-routes-btn" style="padding: 9px 18px; background: #0066cc; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer;">🔍 Find Trains</button>
                    </div>
                </div>
                <div id="route-results-container">
                    <p style="text-align: center; color: #a0aec0; padding: 20px;">Select origin and destination stations above to view all scheduled trains for the day.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
